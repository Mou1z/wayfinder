<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>How Wayfinder works</title>
  <desc>A visitor's search goes to your server, where Jev picks one of your pages. The visitor goes to that page, sees a few likely pages, or sees your own fallback. Without a key, or if Jev is slow, word matching answers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5b6b62"/>
    </marker>
  </defs>
  <rect width="860" height="300" rx="16" fill="#f7f8f6"/>

  <!-- 1. The visitor -->
  <rect x="24" y="96" width="190" height="96" rx="12" fill="#fff" stroke="#d5dbd6"/>
  <text x="119" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#5b6b62">1 · A visitor types</text>
  <rect x="40" y="138" width="158" height="34" rx="17" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
  <text x="119" y="160" text-anchor="middle" font-size="13" fill="#1d2420">"my kid is bored"</text>

  <path d="M218 144h46" stroke="#5b6b62" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Jev chooses -->
  <rect x="270" y="56" width="250" height="176" rx="12" fill="#fff" stroke="#d5dbd6"/>
  <text x="395" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#5b6b62">2 · Jev picks one of your pages</text>
  <g font-size="12.5" fill="#1d2420">
    <rect x="290" y="98" width="210" height="26" rx="6" fill="#eef1ee"/>
    <text x="302" y="115">Opening hours</text>
    <rect x="290" y="130" width="210" height="26" rx="6" fill="#dcefe4" stroke="#2f6b4f"/>
    <text x="302" y="147" font-weight="600" fill="#1f5a3e">Children and families  ✓</text>
    <rect x="290" y="162" width="210" height="26" rx="6" fill="#eef1ee"/>
    <text x="302" y="179">Local history</text>
  </g>
  <text x="395" y="212" text-anchor="middle" font-size="11.5" fill="#5b6b62">It can only pick from the list. It never writes text.</text>

  <path d="M524 144c30 0 30-74 60-74" fill="none" stroke="#5b6b62" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M524 144h60" stroke="#5b6b62" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M524 144c30 0 30 74 60 74" fill="none" stroke="#5b6b62" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. The outcomes -->
  <text x="712" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#5b6b62">3 · The visitor…</text>
  <rect x="590" y="50" width="244" height="40" rx="10" fill="#2f6b4f"/>
  <text x="712" y="75" text-anchor="middle" font-size="13" fill="#fff">goes straight to the page</text>
  <rect x="590" y="124" width="244" height="40" rx="10" fill="#fff" stroke="#2f6b4f"/>
  <text x="712" y="149" text-anchor="middle" font-size="13" fill="#1f5a3e">picks from a few, if Jev isn't sure</text>
  <rect x="590" y="198" width="244" height="40" rx="10" fill="#fff" stroke="#c9a227"/>
  <text x="712" y="223" text-anchor="middle" font-size="13" fill="#6b5410">sees your fallback, if none fit</text>

  <text x="430" y="278" text-anchor="middle" font-size="12" fill="#5b6b62">No API key, or Jev too slow? Simple word matching answers instead, so search always works.</text>
</svg>
